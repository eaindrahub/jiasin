<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--sky:#dbeeff;--blue:#a9d1f5;--mid:#7fb5e8;--deep:#3f6fa3;--ink:#35618f;--white:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Quicksand","Trebuchet MS",sans-serif;font-weight:600;overflow-x:hidden;
 background:linear-gradient(180deg,#ffffff 0%,#eef7ff 45%,#d6eaff 100%) fixed}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#fx i{position:absolute;font-style:normal;opacity:0;animation:soft 2.4s ease forwards,drift var(--dur,22s) ease-in-out infinite alternate}
@keyframes soft{to{opacity:.32}}
@keyframes drift{0%{transform:translate(0,0) rotate(-12deg)}33%{transform:translate(var(--x1),var(--y1)) rotate(14deg)}66%{transform:translate(var(--x2),var(--y2)) rotate(-10deg)}100%{transform:translate(var(--x3),var(--y3)) rotate(12deg)}}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:50;font-family:inherit;font-size:13px;font-weight:700;color:var(--deep);background:rgba(255,255,255,.85);border:2px solid var(--blue);border-radius:99px;padding:7px 13px;cursor:pointer;box-shadow:0 3px 10px rgba(127,181,232,.3)}
.scr{overflow-x:clip;display:none;min-height:100vh;padding:56px 20px 56px;position:relative;z-index:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
.scr.on{display:flex;animation:pg .9s ease both}
@keyframes pg{from{opacity:0}to{opacity:1}}
.fi{opacity:0;transform:translateY(14px);animation:fi 1.1s ease forwards;animation-delay:var(--d,0s)}
@keyframes fi{to{opacity:1;transform:none}}
.hint{font-size:12px;color:var(--mid);letter-spacing:.5px}
.guitar{width:clamp(90px,24vw,130px);filter:drop-shadow(0 8px 12px rgba(127,181,232,.35));transform-origin:50% 90%;animation:gin 1.6s cubic-bezier(.3,1.4,.5,1) .3s both,sway 4.5s ease-in-out 2s infinite alternate}
@keyframes gin{from{opacity:0;transform:translateY(-90px) rotate(-70deg) scale(.5)}to{opacity:1;transform:none}}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.lt{display:inline-block;animation:lt .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes lt{from{opacity:0;transform:translateY(-55px) scale(1.8) rotate(-14deg)}to{opacity:1;transform:none}}
.wd{display:inline-block;animation:wd .8s ease both}
@keyframes wd{from{opacity:0;filter:blur(7px)}to{opacity:1;filter:blur(0)}}
.exp{animation:exp 1.8s ease both}
@keyframes exp{from{opacity:0;letter-spacing:.5em}to{opacity:1;letter-spacing:0}}
.bl{animation:wd 1.4s ease 4.8s both}
h1{font-family:"Pacifico","Brush Script MT",cursive;font-weight:400;font-size:clamp(38px,11vw,72px);line-height:1.2;margin:0;color:var(--deep);text-shadow:0 3px 0 #fff,0 6px 18px rgba(127,181,232,.5)}
h1 small{display:block;font-size:.55em;color:var(--mid);margin-top:4px;animation:cake 1s cubic-bezier(.3,1.7,.5,1) both}
@keyframes cake{from{opacity:0;transform:scale(.2) rotate(-40deg)}to{opacity:1;transform:none}}
.wish{white-space:pre-line;max-width:480px;font-size:clamp(16px,4.4vw,20px);font-weight:700;line-height:1.9;margin:0;padding:0 4px;color:var(--ink);text-shadow:0 0 10px #fff,0 0 4px #fff}
.go{font-family:inherit;font-size:clamp(15px,4.2vw,18px);font-weight:700;color:var(--white);background:linear-gradient(180deg,#8ec3f2,#5f9bd6);border:0;border-radius:99px;padding:14px 28px;cursor:pointer;box-shadow:0 8px 20px rgba(95,155,214,.45);margin-top:10px;transition:transform .2s;animation:pop 1s cubic-bezier(.3,1.7,.5,1) backwards}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.go:hover{transform:translateY(-2px) scale(1.03)}.go:active{transform:scale(.97)}
.ask{margin:0;font-size:clamp(14px,4vw,17px);color:var(--deep)}
h2{font-family:"Pacifico","Brush Script MT",cursive;font-weight:400;font-size:clamp(30px,8vw,48px);margin:0;color:var(--deep);text-shadow:0 3px 0 #fff,0 5px 14px rgba(127,181,232,.45)}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 20px;width:100%;max-width:520px;padding:10px 4px}
.pf{position:relative;background:#fff;padding:9px 9px 30px;border-radius:6px;border:2px solid var(--blue);box-shadow:0 10px 24px rgba(95,155,214,.3);pointer-events:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pf:nth-child(1){--t:-3deg}.pf:nth-child(2){--t:2.5deg;margin-top:16px}.pf:nth-child(3){--t:2deg}.pf:nth-child(4){--t:-2.5deg;margin-top:16px}
.pf{opacity:0;animation:var(--an) 1.3s cubic-bezier(.2,.9,.3,1.1) forwards;animation-delay:var(--d,0s)}
.pf.f1{--an:fp1}.pf.f2{--an:fp2}.pf.f3{--an:fp3}.pf.f4{--an:fp4}
@keyframes fp1{from{opacity:0;transform:translateX(-120vw) rotate(-30deg)}to{opacity:1;transform:rotate(var(--t))}}
@keyframes fp2{from{opacity:0;transform:translateX(120vw) rotate(30deg)}to{opacity:1;transform:rotate(var(--t))}}
@keyframes fp3{from{opacity:0;transform:scale(.2) rotate(40deg)}to{opacity:1;transform:rotate(var(--t))}}
@keyframes fp4{from{opacity:0;transform:translateY(-100vh) rotate(-25deg)}to{opacity:1;transform:rotate(var(--t))}}
.pf::before{content:"";position:absolute;top:-11px;left:50%;width:50px;height:18px;margin-left:-25px;background:rgba(169,209,245,.75);transform:rotate(-4deg);border-radius:2px}
.pf::after{content:"♡";position:absolute;left:0;right:0;bottom:7px;font-size:14px;color:var(--mid)}
.pf img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:50% 35%;border-radius:3px;background:var(--sky);pointer-events:none;-webkit-user-drag:none}
.back{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:50;width:38px;height:38px;border-radius:50%;font-family:inherit;font-size:20px;font-weight:700;line-height:1;color:var(--deep);background:rgba(255,255,255,.85);border:2px solid var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 2px 2px 0;box-shadow:0 3px 10px rgba(127,181,232,.3)}
.end{margin:6px 0 0;font-size:clamp(14px,4vw,17px);color:var(--deep)}
</style>
</head>

      <path d="M60 106c-3-4-9-1-6 3 2 3 6 5 6 5s4-2 6-5c3-4-3-7-6-3z" fill="#fff" opacity=".9"/>

  </svg>
  <h1 id="ttl">Happy Birthday<small id="nm"></small></h1>
  <p class="wish" id="wish"></p>
  <button class="go" id="see">tap here for memories 💙</button>
</section>

<section class="scr" id="p2">
  <button class="back" id="back" aria-label="Back">&lt;</button>
  <h2 class="exp">Our Memories</h2>
  <div id="grid"></div>
  <p class="end bl" id="end">Happy birthday again 🥳 When is the treat? 😋</p>
</section>

/* =========================== */

const $=id=>document.getElementById(id);
if(NAME)$('nm').textContent=NAME+' 🎂';else $('nm').textContent='🎂';
const ttl=$('ttl'),small=$('nm'),tx=ttl.firstChild.textContent;ttl.removeChild(ttl.firstChild);
[...tx].forEach((ch,i)=>{const s=document.createElement('span');s.className='lt';s.textContent=ch===' '?'\u00a0':ch;s.style.animationDelay=(.9+i*.08)+'s';ttl.insertBefore(s,small)});
small.style.animationDelay=(.9+tx.length*.08+.25)+'s';
const W0=2.6,ST=.14;let wi=0;
WISH.split(/(\s+)/).forEach(p=>{if(!p)return;
 if(/^\s+$/.test(p)){$('wish').appendChild(document.createTextNode(p));return}
 const s=document.createElement('span');s.className='wd';s.textContent=p;s.style.animationDelay=(W0+wi*ST)+'s';wi++;$('wish').appendChild(s)});
$('see').style.animationDelay=(W0+wi*ST+.6)+'s';

/* photo frames (not clickable) */
PHOTOS.forEach((src,i)=>{const f=document.createElement('div');f.className='pf f'+(i+1);f.style.setProperty('--d',(1+i*.9)+'s');
 const im=document.createElement('img');im.src=src;im.alt='';im.draggable=false;f.appendChild(im);$('grid').appendChild(f)});
$('grid').addEventListener('contextmenu',e=>e.preventDefault());

/* decor drifting all over the screen */
const E=['🎸','🍎','🥑','🥕','🧪','🔬','🥬','🍓','🫐','✨','🤍','💙','🎵','🍋'];
const R=(a,b)=>a+Math.random()*(b-a);
for(let i=0;i<26;i++){const e=document.createElement('i');e.textContent=E[i%E.length];
 const st=e.style;st.left=R(2,92)+'%';st.top=R(2,92)+'%';st.fontSize=(18+R(0,18)|0)+'px';
 ['x1','x2','x3'].forEach(k=>st.setProperty('--'+k,R(-45,45)+'vw'));['y1','y2','y3'].forEach(k=>st.setProperty('--'+k,R(-45,45)+'vh'));
 st.setProperty('--dur',R(16,32)+'s');st.animationDelay=(.3+R(0,3))+'s,'+(-R(0,20))+'s';
 $('fx').appendChild(e)}

/* page switch */
$('see').onclick=()=>{$('p1').classList.remove('on');$('p2').classList.add('on');scrollTo(0,0)};
$('back').onclick=()=>{$('p2').classList.remove('on');$('p1').classList.add('on');scrollTo(0,0)};

/* ---------- Chinese-vibe + funny friendship music (original, WebAudio) ---------- */
let ac,master,muted=false,step=0,nextT=0,timer;
const mf=m=>440*Math.pow(2,(m-69)/12);
const N=null;
const BASS=[[48,55],[45,52],[43,50],[48,55],[45,52],[43,50],[45,52],[48,55]];
const MEL=[
 76,N,79,76,74,N,72,N,  74,N,76,74,72,N,69,N,
 72,72,74,N,76,N,79,N,  81,79,N,76,74,N,N,N,
 79,N,81,79,76,N,74,N,  76,N,79,N,81,N,84,N,
 81,81,79,N,76,N,74,N,  72,N,74,76,72,N,N,N];
const EIGHTH=.27;
function pl(f,t,d,v,type,drop){const o=ac.createOscillator(),g=ac.createGain(),lp=ac.createBiquadFilter();
 o.type=type||'triangle';o.frequency.setValueAtTime(f*(drop||1),t);if(drop)o.frequency.exponentialRampToValueAtTime(f,t+.05);
 lp.type='lowpass';lp.frequency.value=3200;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(lp);lp.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
function boing(t){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';
 o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(700,t+.16);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+.25)}
function sched(){while(nextT<ac.currentTime+.5){
 const bar=(step/8|0)%8,k=step%8,bs=BASS[bar];
 if(step%64===0){[60,62,64,67,69,72,74,76,79].forEach((m,i)=>pl(mf(m),nextT+i*.045,.9,.07,'triangle',1.015))} /* guzheng sweep */
 if(k===0)pl(mf(bs[0]),nextT,.35,.17,'triangle');
 if(k===4)pl(mf(bs[1]),nextT,.3,.13,'triangle');
 if(k===2||k===6)pl(mf(96),nextT,.05,.06,'sine'); /* wood-block tick */
 const m=MEL[step%64];if(m!==N){pl(mf(m),nextT,.55,.13,'triangle',1.02);pl(mf(m+12),nextT,.2,.025,'sine')}
 if((bar===3||bar===7)&&k===7)boing(nextT);
 step++;nextT+=EIGHTH}}
function startMusic(){if(ac)return;try{
 ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=muted?0:.55;
 const dl=ac.createDelay(1),fb=ac.createGain(),wet=ac.createGain();dl.delayTime.value=.2;fb.gain.value=.25;wet.gain.value=.22;
 master.connect(ac.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(ac.destination);
 nextT=ac.currentTime+.15;timer=setInterval(sched,100);
 ac.resume().catch(()=>{})}catch(e){}}
/* try to play as soon as the page opens; if the browser blocks it, resume on the first touch/click */
startMusic();
['pointerdown','touchstart','click','keydown'].forEach(ev=>addEventListener(ev,()=>{startMusic();if(ac&&ac.state==='suspended')ac.resume()},{passive:true}));
$('mute').onclick=()=>{startMusic();muted=!muted;if(master)master.gain.value=muted?0:.55;$('mute').textContent='♪ '+(muted?'OFF':'ON')};
document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else ac.resume().catch(()=>{})});
</script>
